# Paths and Logging Configuration
[paths]
name = "Kodak24_g10_Sd_" # Experiment name
results_path = "./result"
is_save = true
dataset_path = "./datasets/Kodak24"

# Device Configuration
[device]
type = "auto" # choices: 'cuda', 'cpu', 'auto'

# Noise Parameters Configuration
[noise]
type = "gaussian" # choices: 'gaussian', 'poisson' , 'saltpepper' ,'bernoulli' ,'impulse' ,'salt and gauss'
level = 10   # For Gaussian: std dev (0-255 scale). For Poisson: intensity factor. For saltpepper: std dev(0-1). For

# Training Hyperparameters Configuration
[training]
M = 8
max_epoch = 1500
lr = 0.001
step_size = 1000
gamma = 0.5
patch_size = 9
sigma = 15
num_random_candidates_per_anchor = 1024
anchor_processing_batch_size = 2048
similarity_metric = 'l1'
local_search_radius = 10
local_sample_ratio = 0.9

[epoch]
run_epoch = 1
start_epocch = 500